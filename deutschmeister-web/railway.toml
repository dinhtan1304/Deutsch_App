# Set the service's Config File Path to /deutschmeister-web/railway.toml:
# Railway does not resolve this file relative to the Root Directory.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = ["/deutschmeister-web/**"]

[deploy]
# Prerendered, so this checks "the server is up" without touching the API.
healthcheckPath = "/robots.txt"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
