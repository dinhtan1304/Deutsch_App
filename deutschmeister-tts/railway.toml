# Railway deployment for the Piper TTS service.
# Deploy: `railway up` from this directory after `railway link`.
#
# Cost note: Piper (onnxruntime, no torch) is light — the Thorsten medium voice
# needs only a few hundred MB of RAM and runs well on CPU (~10x real-time).
# For high traffic, run multiple containers behind a load balancer.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand — Dockerfile CMD uses shell form `${PORT:-8001}`, which
# Railway's exec runner can't expand. Leaving CMD in charge keeps env-var
# substitution inside the container's shell where it works correctly.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
