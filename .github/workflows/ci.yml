name: CI

on:
  push:
    branches: [main]
    paths:
      - 'deutschmeister-web/**'
      - 'deutschmeister-api'
      - 'deutschmeister-tts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deutschmeister-web/**'
      - 'deutschmeister-api'
      - 'deutschmeister-tts/**'
      - '.github/workflows/ci.yml'

jobs:
  # API tests run in the private API repository's own CI workflow.
  # This repository's GITHUB_TOKEN cannot read that private submodule.
  tts:
    name: TTS cache tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deutschmeister-tts/tests

  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deutschmeister-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deutschmeister-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (strict — blocks on errors only)
        run: npm run lint
        # Use lint:strict to block on warnings too once token migration is complete:
        # run: npm run lint:strict

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: deutschmeister-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deutschmeister-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Test release announcement and learning routes
        run: npm run test:e2e

      - name: Check bundle size
        run: node scripts/check-bundle-size.mjs
