name: CI

on:
  push:
    branches: [main]
    paths:
      - 'deutschmeister-web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deutschmeister-web/**'

jobs:
  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deutschmeister-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deutschmeister-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (strict — blocks on errors only)
        run: npm run lint
        # Use lint:strict to block on warnings too once token migration is complete:
        # run: npm run lint:strict

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: deutschmeister-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deutschmeister-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}

      - name: Check bundle size
        run: |
          BUILD_SIZE=$(du -sh .next/ | cut -f1)
          echo "Build output size: $BUILD_SIZE"
          # Fail if total .next/static exceeds 5MB
          STATIC_KB=$(du -sk .next/static/ | cut -f1)
          echo "Static assets: ${STATIC_KB}KB"
          if [ "$STATIC_KB" -gt 5120 ]; then
            echo "::error::Static bundle exceeds 5MB budget (${STATIC_KB}KB)"
            exit 1
          fi
